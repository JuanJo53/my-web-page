<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="../src/assets/images/brand-logo/logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#14221f" />
		<meta
			name="description"
			content="Juan José Fernández Duarte — systems engineer and software builder. Digital CV, portfolio, and contact."
		/>
		<title>Juan Jo — Resume</title>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem("jjfd-theme");
					var theme =
						stored === "light" || stored === "dark"
							? stored
							: window.matchMedia("(prefers-color-scheme: light)").matches
								? "light"
								: "dark";
					document.documentElement.setAttribute("data-theme", theme);
				} catch (e) {
					document.documentElement.setAttribute("data-theme", "dark");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
